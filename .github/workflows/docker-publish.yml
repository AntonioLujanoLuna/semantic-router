name: Create and publish Docker images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_suffix:
        description: "Custom tag suffix for the Docker image"
        required: false
        type: string
        default: ""
      is_nightly:
        description: "Whether this is a nightly build"
        required: false
        type: boolean
        default: false
      use_cross_compilation:
        description: "Use cross-compilation instead of emulation for ARM64"
        required: false
        type: boolean
        default: true
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "tools/docker/Dockerfile*"
      - "candle-binding/**"
      - "src/**"
      - "e2e/testing/llm-katan/**"
      - "dashboard/**"
      - "src/vllm-sr/**"
  pull_request:
    paths:
      - ".github/workflows/docker-publish.yml"
      - "tools/docker/Dockerfile*"
      - "candle-binding/**"
      - "src/**"
      - "e2e/testing/llm-katan/**"
      - "dashboard/**"
      - "src/vllm-sr/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build architecture-specific Docker images using native runners for optimal performance
  build_multiarch:
    # Allow running on fork for testing (remove AntonioLujanoLuna before upstream merge)
    if: (github.repository == 'vllm-project/semantic-router' || github.repository == 'AntonioLujanoLuna/semantic-router') && !github.event.pull_request.draft
    # Use native ARM64 runners for arm64 builds - 10-20x faster than QEMU emulation
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Explicit timeout to prevent indefinite hangs (target: <60 min per build)
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [extproc, llm-katan, vllm-sr]
        # Build each architecture separately on native runners
        # PR builds only build amd64 for speed
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64", "arm64"]') }}
      fail-fast: false

    steps:
      # Standard disk cleanup for all images
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # QEMU is no longer needed - using native ARM64 runners instead
      # This provides 10-20x faster builds compared to emulation

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enhanced Rust caching for extproc builds (architecture-specific)
      - name: Cache Rust dependencies (extproc)
        if: matrix.image == 'extproc'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candle-binding/target/
            ~/.rustup/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('candle-binding/Cargo.toml') }}-${{ hashFiles('candle-binding/Cargo.lock') }}-${{ hashFiles('candle-binding/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('candle-binding/Cargo.toml') }}-${{ hashFiles('candle-binding/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('candle-binding/Cargo.toml') }}-
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      # Python caching for llm-katan builds (architecture-specific)
      - name: Cache Python dependencies (llm-katan)
        if: matrix.image == 'llm-katan'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            e2e/testing/llm-katan/.venv
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('e2e/testing/llm-katan/requirements.txt', 'e2e/testing/llm-katan/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-

      # Node.js and Go caching for dashboard builds (architecture-specific)
      - name: Cache Node.js dependencies (dashboard)
        if: matrix.image == 'dashboard'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            dashboard/frontend/node_modules
          key: ${{ runner.os }}-${{ matrix.arch }}-node-${{ hashFiles('dashboard/frontend/package.json', 'dashboard/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-node-

      - name: Cache Go dependencies (dashboard)
        if: matrix.image == 'dashboard'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            dashboard/backend/go.sum
          key: ${{ runner.os }}-${{ matrix.arch }}-go-${{ hashFiles('dashboard/backend/go.mod', 'dashboard/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Generate date tag for nightly builds
        id: date
        if: inputs.is_nightly == true
        run: echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        run: echo "REPOSITORY_OWNER_LOWER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set build parameters
        id: build-params
        run: |
          if [ "${{ matrix.image }}" = "extproc" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=./tools/docker/Dockerfile.extproc" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.image }}" = "llm-katan" ]; then
            echo "context=./e2e/testing/llm-katan" >> $GITHUB_OUTPUT
            echo "dockerfile=./e2e/testing/llm-katan/Dockerfile" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.image }}" = "dashboard" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=./dashboard/backend/Dockerfile" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.image }}" = "vllm-sr" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=./src/vllm-sr/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Generate tags
        id: tags
        run: |
          REPO_LOWER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')
          ARCH="${{ matrix.arch }}"

          if [ "${{ inputs.is_nightly }}" = "true" ]; then
            BASE_TAG="nightly-${{ steps.date.outputs.date_tag }}"
          else
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              BASE_TAG="${{ github.sha }}"
            else
              BASE_TAG="pr-${{ github.event.number }}"
            fi
          fi

          # Generate architecture-specific tags (will be combined into manifest later)
          TAGS="ghcr.io/${REPO_LOWER}/semantic-router/${{ matrix.image }}:${BASE_TAG}-${ARCH}"

          # Add architecture-specific latest tag for non-nightly, non-PR builds
          if [ "${{ inputs.is_nightly }}" != "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}/semantic-router/${{ matrix.image }}:latest-${ARCH}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "base_tag=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Additional cleanup for llm-katan (large Python packages)
        if: matrix.image == 'llm-katan'
        run: |
          echo "Freeing up more space for llm-katan build..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Record build start time
        id: build-start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.image }} Docker image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build-params.outputs.context }}
          file: ${{ steps.build-params.outputs.dockerfile }}
          # Build for single platform (native to runner) - no emulation needed
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Use architecture-specific cache scope for better hit rates
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            CARGO_BUILD_JOBS=16
            CARGO_INCREMENTAL=1
            RUSTC_WRAPPER=""
            CARGO_NET_GIT_FETCH_WITH_CLI=true
            BUILDKIT_PROGRESS=plain

      - name: Build summary with timing metrics
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.build-start.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))

          echo "### Build Summary for ${{ matrix.image }} (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice title=Build Success::${{ matrix.image }}/${{ matrix.arch }} built in ${DURATION_MIN}m ${DURATION_SEC}s"
            echo "✅ **Status**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Platform**: linux/${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Runner**: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm (native)' || 'ubuntu-latest (native)' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Time**: ${DURATION_MIN}m ${DURATION_SEC}s" >> $GITHUB_STEP_SUMMARY
            echo "- **Tags**: ${{ steps.tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error title=Build Failed::${{ matrix.image }}/${{ matrix.arch }} build failed after ${DURATION_MIN}m ${DURATION_SEC}s"
            echo "❌ **Status**: Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Platform**: linux/${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Time**: ${DURATION_MIN}m ${DURATION_SEC}s" >> $GITHUB_STEP_SUMMARY
          fi

    outputs:
      base_tag: ${{ steps.tags.outputs.base_tag }}
      repo_lower: ${{ steps.tags.outputs.repo_lower }}

  # Create multi-architecture manifest lists combining arch-specific images
  # This job runs after all architecture-specific builds complete
  create_manifest:
    # Allow running on fork for testing (remove AntonioLujanoLuna before upstream merge)
    if: (github.repository == 'vllm-project/semantic-router' || github.repository == 'AntonioLujanoLuna/semantic-router') && github.event_name != 'pull_request'
    needs: build_multiarch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [extproc, llm-katan, vllm-sr]
      fail-fast: false

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag for nightly builds
        id: date
        if: inputs.is_nightly == true
        run: echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set manifest parameters
        id: params
        run: |
          REPO_LOWER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')

          if [ "${{ inputs.is_nightly }}" = "true" ]; then
            BASE_TAG="nightly-${{ steps.date.outputs.date_tag }}"
          else
            BASE_TAG="${{ github.sha }}"
          fi

          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "base_tag=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "image_base=ghcr.io/${REPO_LOWER}/semantic-router/${{ matrix.image }}" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_BASE="${{ steps.params.outputs.image_base }}"
          BASE_TAG="${{ steps.params.outputs.base_tag }}"

          echo "Creating manifest for ${IMAGE_BASE}:${BASE_TAG}"

          # Create manifest combining amd64 and arm64 images
          docker manifest create ${IMAGE_BASE}:${BASE_TAG} \
            ${IMAGE_BASE}:${BASE_TAG}-amd64 \
            ${IMAGE_BASE}:${BASE_TAG}-arm64

          # Annotate with architecture information
          docker manifest annotate ${IMAGE_BASE}:${BASE_TAG} \
            ${IMAGE_BASE}:${BASE_TAG}-amd64 --arch amd64 --os linux
          docker manifest annotate ${IMAGE_BASE}:${BASE_TAG} \
            ${IMAGE_BASE}:${BASE_TAG}-arm64 --arch arm64 --os linux

          # Push the manifest
          docker manifest push ${IMAGE_BASE}:${BASE_TAG}

          echo "✅ Pushed multi-arch manifest: ${IMAGE_BASE}:${BASE_TAG}"

      - name: Create and push latest manifest
        if: inputs.is_nightly != true
        run: |
          IMAGE_BASE="${{ steps.params.outputs.image_base }}"

          echo "Creating latest manifest for ${IMAGE_BASE}"

          # Create latest manifest combining amd64 and arm64 images
          docker manifest create ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:latest-amd64 \
            ${IMAGE_BASE}:latest-arm64

          # Annotate with architecture information
          docker manifest annotate ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:latest-amd64 --arch amd64 --os linux
          docker manifest annotate ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:latest-arm64 --arch arm64 --os linux

          # Push the manifest
          docker manifest push ${IMAGE_BASE}:latest

          echo "✅ Pushed multi-arch manifest: ${IMAGE_BASE}:latest"

      - name: Manifest summary
        run: |
          IMAGE_BASE="${{ steps.params.outputs.image_base }}"
          BASE_TAG="${{ steps.params.outputs.base_tag }}"

          echo "### Multi-arch Manifest for ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Manifest**: ${IMAGE_BASE}:${BASE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architectures**: amd64, arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Source images**:" >> $GITHUB_STEP_SUMMARY
          echo "  - ${IMAGE_BASE}:${BASE_TAG}-amd64" >> $GITHUB_STEP_SUMMARY
          echo "  - ${IMAGE_BASE}:${BASE_TAG}-arm64" >> $GITHUB_STEP_SUMMARY
